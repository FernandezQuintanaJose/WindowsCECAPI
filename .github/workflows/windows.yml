name: App de Windows

# Pruebas en Linux y el instalador .exe en un equipo Windows de GitHub (jpackage solo genera el
# instalador del sistema donde corre). Al subir una etiqueta vX.Y.Z se publica en GitHub Releases.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Pruebas
        run: ./gradlew test --console=plain

  instalador:
    needs: pruebas
    runs-on: windows-latest
    permissions:
      contents: write # solo se usa para publicar la versión cuando es una etiqueta v*
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Generar el instalador .exe
        # La dirección del servidor y la clave salen de los secretos del repositorio
        # (Settings > Secrets and variables > Actions). Sin ellos, la app avisa que no tiene servidor.
        env:
          CECAPI_SERVIDOR: ${{ secrets.CECAPI_SERVIDOR }}
          CECAPI_CLAVE_APP: ${{ secrets.CECAPI_CLAVE_APP }}
        run: ./gradlew packageExe --console=plain
      - name: Suma SHA-256
        shell: pwsh
        run: |
          $exe = Get-ChildItem build/compose/binaries/main/exe/*.exe | Select-Object -First 1
          $suma = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$suma  $($exe.Name)" | Out-File -Encoding ascii "$($exe.FullName).sha256"
          Write-Output "SHA-256 de $($exe.Name): $suma"
      - uses: actions/upload-artifact@v4
        with:
          name: CECAPI-windows
          path: build/compose/binaries/main/exe/
      - name: Publicar en GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ETIQUETA: ${{ github.ref_name }}
        run: |
          $archivos = (Get-ChildItem build/compose/binaries/main/exe/*).FullName
          gh release create "$env:ETIQUETA" $archivos `
            --title "CECAPI para Windows $env:ETIQUETA" `
            --notes "Instalador .exe de la app de CECAPI para Windows. Compara la suma SHA-256 del archivo .sha256 antes de instalar. Windows puede mostrar el aviso de SmartScreen porque la app todavía es nueva."
